[env:c6_zero]
; Auf einen getesteten pioarduino-Release pinnen statt auf ein bewegliches Git-HEAD.
; Das haelt den Arduino-C6-Pfad fuer dieses Board stabil und vermeidet unkontrollierte
; Spruenge auf neue pioarduino-Staende.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip

; Waveshare ESP32-C6-Zero (kompatibel mit ESP32-C6 DevKitM Profil)
board = esp32-c6-devkitm-1
framework = arduino
extra_scripts = 
	pre:tools/pio_riscv_toolchain_path.py
	pre:../Dukatimer-Part2/tools/check_dukatimer_protocol_sync.py

monitor_speed = 115200

; Zwingt den Chip, den USB-C Port für den Serial Monitor zu nutzen
build_flags = 
	-D ARDUINO_USB_MODE=0

lib_deps = 
	olikraus/U8g2 @ ^2.34.22
	adafruit/Adafruit TSL2591 Library @ ^1.4.3
	adafruit/Adafruit BusIO @ ^1.14.1
	mathertel/RotaryEncoder @ ^1.5.3