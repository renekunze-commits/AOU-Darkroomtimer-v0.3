[platformio]
; Direkte CLI-Befehle fuer genau diesen Probe-Sketch:
;   Upload:  pio run -d .\tools\teensy41_psram_probe -e teensy41_psram_probe -t upload
;   Monitor: pio device monitor -d .\tools\teensy41_psram_probe -e teensy41_psram_probe
; Wenn die Port-Autowahl wegen mehrerer serieller Geraete falsch liegt,
; den Monitor-Befehl um `-p COMx` ergaenzen.

[env:teensy41_psram_probe]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags =
    -DDUKATIMER_TEENSY_HAS_PSRAM=1
    -DDUKATIMER_TEENSY_PSRAM_MB=16
    -DTEENSY_OPT_SMALLEST_CODE_LTO
