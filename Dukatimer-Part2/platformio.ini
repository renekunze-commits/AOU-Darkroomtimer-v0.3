; =============================================================================
; DUKATIMER v1.0 - Dual MCU Workspace
; =============================================================================

[platformio]
; Standardmäßig werden beide kompiliert, wenn du auf "Build" drückst.
default_envs = teensy41, esp32s3_n16r8

; ---------------------------------------------------------
; GEMEINSAME EINSTELLUNGEN (Für beide MCUs)
; ---------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200


; =============================================================================
; GEHIRN 1: TEENSY 4.1 (Echtzeit, LEDs, Audio, Display, Belichtung)
; =============================================================================
[env:teensy41]
platform = teensy
board = teensy41
build_src_filter = +<teensy/>
build_unflags =
    -O2
build_flags =
    -I include
    -DLV_CONF_PATH=lv_conf.h
    -DDISABLE_FS_H_WARNING
    ; Teensy 4.1 Memory-Policy: 16MB externes PSRAM sind bestueckt und werden
    ; gezielt per EXTMEM fuer grosse, nicht-zeitkritische Daten genutzt.
    -DDUKATIMER_TEENSY_HAS_PSRAM=1
    -DDUKATIMER_TEENSY_PSRAM_MB=16
    ; RAM1-Druck reduzieren: kleinere Codegroesse + LTO.
    -DTEENSY_OPT_SMALLEST_CODE_LTO
extra_scripts =
    pre:tools/check_teensy_storage_policy.py
    pre:tools/check_dukatimer_protocol_sync.py

lib_deps =
    ; --- Displays & LEDs (Laufen hart auf dem Teensy) ---
    https://github.com/mjs513/ILI9488_t3.git
    adafruit/Adafruit GFX Library @ ^1.12.6
    lvgl/lvgl @ ^8.3.11
    makuna/NeoPixelBus @ ^2.8.0
    paulstoffregen/XPT2046_Touchscreen
    ;https://github.com/Seeed-Studio/Grove_LCD_RGB_Backlight.git LCD entfällt, da tft über SPI
    
    ; --- Input / Timing / Storage ---
    paulstoffregen/Encoder @ ^1.4.4
    luni64/TeensyTimerTool @ ^1.4.1
    greiman/SdFat @ ^2.3.1

   

; =============================================================================
; GEHIRN 2: ESP32-S3-N16R8 (WLAN, Menü-Encoder, Umgebungssensoren)
; =============================================================================
[env:esp32s3_n16r8]
platform = espressif32@6.7.0
board = 4d_systems_esp32s3_gen4_r8n16
build_src_filter = +<esp32/>
upload_port = COM14 ; <--- Ggf. anpassen, wenn der ESP32 dranhängt

; --- BOARD & CPU SETTINGS ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.filesystem = littlefs

; --- SPEICHER-KONFIGURATION (N16R8) ---
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; --- COMPILER-OPTIMIERUNG & FLAGS ---
build_unflags = -Os
build_flags = 
    -O3
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM=1
    -D CONFIG_SPIRAM_SUPPORT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:tools/check_dukatimer_protocol_sync.py

lib_deps =
    ; --- Menü & Umgebung (Laufen auf dem ESP32) ---
    madhephaestus/ESP32Encoder @ ^0.10.1
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit BME280 Library @ ^2.2.4

; =============================================================================
; NATIVE TEST-HARNESS (kein Flash, kein Upload)
; Verwendet den Host-Compiler um die Acceptance-Tests als eigenstaendige
; Programme zu validieren. Wird NICHT in default_envs gefuehrt.
; Aufruf: pio run -e ap_bw_native
; =============================================================================
[env:ap_bw_native]
platform = native
framework =
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I src/teensy
    -I test/support
build_src_filter =
    -<*>
    +<../test/ap_bw_blackwhite_acceptance/test_main.cpp>