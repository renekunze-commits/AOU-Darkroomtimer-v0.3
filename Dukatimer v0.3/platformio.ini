; =============================================================================
; DUKATIMER v0.5 - platformio.ini
; Target: ESP32-S3-N16R8 (16MB QIO Flash, 8MB Octal PSRAM)
;
; PSRAM-Bootloop-Ursache & Fix:
;
;   ALT: board = esp32-s3-devkitc-1  --> "N8, No PSRAM"-Variante.
;   Das Board-JSON hat kein memory_type=qio_opi, kein BOARD_HAS_PSRAM.
;   Ergebnis: psramFound()=false, heap_caps auf SPIRAM liefert NULL -> Bootloop.
;
;   NEU: board = 4d_systems_esp32s3_gen4_r8n16
;   Dieses lokal installierte Board-JSON deckt exakt den R8N16-Chip ab:
;   - memory_type = qio_opi (OPI-PSRAM-Controller aktiv)
;   - BOARD_HAS_PSRAM baked in
;   - variant = esp32_s3r8n16 (vorhandene Variant-Folder)
;   - default_16MB.csv, 16MB Flash
;   Falls Bootloop trotzdem: PSRAM-Typ des Chips ist QSPI statt OPI ->
;   Zeile unten auskommentieren und esp32-s3-devkitc1-n8r2 (QSPI) testen.
; =============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0
; Board mit verifiziertem qio_opi + BOARD_HAS_PSRAM + 16MB Flash (lokal installiert)
; Alternativen falls Bootloop: esp32-s3box | adafruit_feather_esp32s3 (QSPI 2MB)
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200

; --- BOARD & CPU SETTINGS ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.filesystem = littlefs

; --- SPEICHER-KONFIGURATION (N16R8) ---
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Hinweis: partitions + memory_type + BOARD_HAS_PSRAM sind im Board-JSON bereits enthalten.
; Diese Zeilen überschreiben das Board-JSON explizit (redundant, aber sicher):
board_build.partitions = default_16MB.csv

; --- COMPILER-OPTIMIERUNG ---
build_unflags = -Os
build_flags = 
    -O3
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM=1
    -D CONFIG_SPIRAM_SUPPORT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; --- Displays & LEDs ---
    https://github.com/Seeed-Studio/Grove_LCD_RGB_Backlight.git
    makuna/NeoPixelBus @ ^2.8.0
    
    ; --- Core Hardware ---
    madhephaestus/ESP32Encoder @ ^0.10.1
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    
    ; --- Adafruit Sensoren (Harte Versionen für Reproduzierbarkeit) ---
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit TSL2591 Library @ ^1.4.5
    adafruit/Adafruit TSL2561 @ ^1.1.2
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit BME280 Library @ ^2.2.4

upload_port = COM14